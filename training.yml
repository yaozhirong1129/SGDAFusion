
GPU: [0]

VERBOSE: True

Datasets:
  data: 'night'

# Optimization arguments.
OPTIM:
  BATCH_SIZE: 4
  NUM_EPOCHS: 100
  LR_INITIAL: 1e-4
  LR_MIN: 1e-6
  BETA1: 0.9

TRAINING:
  VAL_AFTER_EVERY: 10
  RESUME: False
  TRAIN_DIR: './dataset/train'       # path to training data
  SAVE_DIR: './checkpoints/save_pth'           # path to save models
  CSV_DIR: './dataset/train.csv'

DinoSetting:
  hub_path: './dinov2/'
  model_type: 'dinov2_vitb14_reg'
  pth_path: './dinov2/dinov2_vitb14_reg4_pretrain.pth'

clipSetting:
  clip_path: './ViT-B-32.pt'